[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fagan-nomogram-bayesian-updater"
version = "3.0.0"
description = "Fagan Nomogram & Bayesian Diagnostic Probability Updater — clinical decision support with zero-dependency core and optional FastAPI/Prometheus telemetry."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dr. Abu Suraih Sakhri" },
]
keywords = ["fagan-nomogram", "bayesian", "diagnostic", "clinical", "likelihood-ratios"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
test = ["pytest>=8.0"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0", "pytest>=8.0"]

[project.scripts]
fagan-nomogram = "fagan_nomogram:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
