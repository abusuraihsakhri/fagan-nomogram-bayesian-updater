[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fagan-nomogram-bayesian-updater"
version = "3.1.0"
description = "Fagan nomogram and Bayesian post-test probability calculator with CLI, CSV, browser UI and optional API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
keywords = ["fagan-nomogram", "bayesian", "diagnostics", "likelihood-ratios"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2"]
test = ["pytest>=8", "httpx>=0.27"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2", "pytest>=8", "httpx>=0.27"]

[project.scripts]
fagan-nomogram = "fagan_nomogram:main"

[tool.setuptools]
py-modules = ["fagan_nomogram", "cli", "simulator", "enrichment"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
