name: Publish Fagan Calculator
on:
  push:
    branches: [master]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: mkdir -p _site && cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --show-error --fail --location --max-time 20 "$PAGE_URL" -o /tmp/fagan-live.html \
              && grep -Fq '<title>Fagan Nomogram | Bayesian Diagnostic Updater</title>' /tmp/fagan-live.html \
              && grep -Fq 'id="nomogram"' /tmp/fagan-live.html \
              && grep -Fq 'id="pretest"' /tmp/fagan-live.html; then
              echo "Live calculator HTML verified at $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Live calculator smoke test failed" >&2
          exit 1
